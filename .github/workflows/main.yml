name: Build ScriptHookV

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      uses: nuget/setup-nuget@v1

    - name: Restore Dependencies
      run: nuget restore ScriptHookV-master/ScriptHookV.sln

    # Fixed: Added /p:PlatformToolset=v143 to retarget the legacy 2017 compiler configuration
    - name: Build Release Configuration
      run: msbuild ScriptHookV-master/ScriptHookV.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 /m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ScriptHookV-Binaries
        path: |
          ScriptHookV-master/x64/Release/*.dll
          ScriptHookV-master/x64/Release/*.asi
        if-no-files-found: warn
