name: Build ScriptHookV

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      uses: nuget/setup-nuget@v1

    # Fixed: Added the correct subfolder path for NuGet restore
    - name: Restore Dependencies
      run: nuget restore ScriptHookV-master/ScriptHookV.sln

    # Fixed: Added the correct subfolder path for the MSBuild compilation step
    - name: Build Release Configuration
      run: msbuild ScriptHookV-master/ScriptHookV.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ScriptHookV-Binaries
        # Fixed: Adjusted search scope paths to capture the files from inside the subfolder structure
        path: |
          ScriptHookV-master/x64/Release/*.dll
          ScriptHookV-master/x64/Release/*.asi
        if-no-files-found: warn
