name: Build ScriptHookV

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      uses: nuget/setup-nuget@v1

    - name: Restore Dependencies
      run: nuget restore ScriptHookV.sln

    - name: Build Release Configuration
      run: msbuild ScriptHookV.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ScriptHookV-Binaries
        # Corrected paths to ensure it grabs the actual compiled x64 binaries
        path: |
          x64/Release/*.dll
          x64/Release/*.asi
        if-no-files-found: warn
