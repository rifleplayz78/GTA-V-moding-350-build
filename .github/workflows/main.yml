name: Build ScriptHookV Build 350 Dedicated

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      uses: nuget/setup-nuget@v1

    - name: Restore Dependencies
      run: nuget restore ScriptHookV-master/ScriptHookV.sln

    # Automatically upgrades Pattern.h syntax before compiling
    - name: Upgrade Pattern.h Legacies
      shell: powershell
      run: |
        $patternPath = "ScriptHookV-master/ScriptHookV/Utility/Pattern.h"
        if (Test-Path $patternPath) {
            $content = Get-Content $patternPath
            
            # Step 1: Force compiler to bring back removed traits
            $macroPatch = @(
                "#define _HAS_FEATURES_REMOVED_IN_CXX20 1",
                "#include <type_traits>"
            )
            $content = $macroPatch + $content
            
            # Step 2: Swap the broken HMODULE declaration logic
            $oldHmodule = "mem::module mod = GetModuleHandleA(NULL);"
            $newHmodule = "mem::module mod = mem::module(reinterpret_cast<uintptr_t>(GetModuleHandleA(NULL)));"
            $content = $content -replace [regex]::Escape($oldHmodule), $newHmodule
            
            Set-Content -Path $patternPath -Value $content
            Write-Host "Pattern.h has been successfully upgraded for the compiler!"
        } else {
            Write-Warning "Target file path not found."
        }

    - name: Build Release Configuration
      run: msbuild ScriptHookV-master/ScriptHookV.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:PlatformToolset=v143 /m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ScriptHookV-Build350
        path: |
          ScriptHookV-master/x64/Release/*.dll
        if-no-files-found: warn
