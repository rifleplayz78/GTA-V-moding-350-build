name: Build ScriptHookV Build 350 Dedicated

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      uses: nuget/setup-nuget@v1

    - name: Restore Dependencies
      run: nuget restore ScriptHookV-master/ScriptHookV.sln

    # Automated step to fix the explicit HMODULE casting constraint mismatch inside Pattern.h
    - name: Patch Pattern.h HMODULE Compilation Error
      shell: powershell
      run: |
        $patternPath = "ScriptHookV-master/ScriptHookV/Utility/Pattern.h"
        if (Test-Path $patternPath) {
            $content = Get-Content $patternPath -Raw
            
            # Target the structural module mapping methods to return a wrapped mem::handle object
            $oldNamedA = "return GetModuleHandleA(name);"
            $newNamedA = "return mem::handle(GetModuleHandleA(name));"
            
            $oldNamedW = "return GetModuleHandleW(name);"
            $newNamedW = "return mem::handle(GetModuleHandleW(name));"
            
            $oldNamedN = "return GetModuleHandleA(nullptr);"
            $newNamedN = "return mem::handle(GetModuleHandleA(nullptr));"
            
            $content = $content.Replace($oldNamedA, $newNamedA)
            $content = $content.Replace($oldNamedW, $newNamedW)
            $content = $content.Replace($oldNamedN, $newNamedN)
            
            Set-Content -Path $patternPath -Value $content -NoNewline
            Write-Host "Pattern.h explicit casting patches successfully applied."
        } else {
            Write-Warning "Target file layout path not detected."
        }

    # Added /p:LanguageStandard=stdcpp17 to instantly fix the parameter pack errors in NativeInvoker.h
    - name: Build Release Configuration
      run: |
        msbuild ScriptHookV-master/ScriptHookV.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:WindowsTargetPlatformVersion=10.0 `
          /p:PlatformToolset=v143 `
          /p:LanguageStandard=stdcpp17 `
          /m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ScriptHookV-Build350
        path: |
          ScriptHookV-master/x64/Release/*.dll
        if-no-files-found: warn
