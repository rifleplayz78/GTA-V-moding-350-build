name: Build GTA V Mods
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Mod Archive
        run: |
          Expand-Archive -Path "Reloaded mods.zip" -DestinationPath "extracted_mods" -Force
        shell: pwsh

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check Extracted Files
        run: |
          Get-ChildItem -Recurse "extracted_mods"
        shell: pwsh
