name: Extract and Push Mods
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Mod Archive
        run: |
          Expand-Archive -Path "Reloaded mods.zip" -DestinationPath "." -Force
        shell: pwsh

      - name: Commit and Push Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract Reloaded mods.zip into root view" || echo "No changes to commit"
          git push
        shell: bash
