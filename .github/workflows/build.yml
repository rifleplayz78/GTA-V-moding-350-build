name: Build All GTA V Mods (Build 350)
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Retarget Projects for VS2022, Latest SDK, and C++17
        run: |
          $sdkVersion = "$env:WindowsSDKVersion".TrimEnd('\')
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            [xml]$xml = Get-Content $_.FullName
            
            # Set target Windows SDK dynamically from runner environment
            $nodes = $xml.GetElementsByTagName('WindowsTargetPlatformVersion')
            foreach ($node in $nodes) {
              $node.InnerText = $sdkVersion
            }
            
            # Retarget platform toolset to VS 2022 (v143)
            $toolsets = $xml.GetElementsByTagName('PlatformToolset')
            foreach ($toolset in $toolsets) {
              $toolset.InnerText = 'v143'
            }
            
            # Enforce C++17 standard to support legacy STL constructs like std::result_of
            $cppLangNodes = $xml.GetElementsByTagName('LanguageStandard')
            foreach ($node in $cppLangNodes) {
              $node.InnerText = 'stdcpp17'
            }
            
            $xml.Save($_.FullName)
          }
        shell: pwsh

      - name: Restore NuGet Packages
        run: nuget restore "ScriptHookV-master/ScriptHookV.sln"
        shell: cmd

      - name: Pre-compile StackWalker Dependency
        run: |
          # Detect and isolate StackWalker dependency compilation before main solution build
          $stackWalkerProj = Get-ChildItem -Recurse -Filter *StackWalker*.vcxproj | Select-Object -First 1
          if ($stackWalkerProj) {
            Write-Host "Compiling StackWalker dependency directly: $($stackWalkerProj.FullName)"
            msbuild $stackWalkerProj.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
            
            # Stage compiled StackWalker.lib in all relative linker lookup paths
            $libs = Get-ChildItem -Recurse -Filter StackWalker.lib
            foreach ($lib in $libs) {
              Write-Host "Found compiled lib at: $($lib.FullName)"
              Copy-Item $lib.FullName -Destination "ScriptHookV-master/ScriptHookV/" -Force -ErrorAction SilentlyContinue
              Copy-Item $lib.FullName -Destination "ScriptHookV-master/" -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "No standalone StackWalker project found; compiling via solution target..."
            msbuild "ScriptHookV-master/ScriptHookV.sln" /t:StackWalker /p:Configuration=Release /p:Platform=x64
          }
        shell: pwsh

      - name: Build ScriptHookV
        run: msbuild "ScriptHookV-master/ScriptHookV.sln" /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /p:TreatWarningsAsErrors=false /restore
        shell: cmd

      - name: Build Heap Adjuster
        run: msbuild "gtav-HeapAdjuster-ini-master/HeapAdjuster.sln" /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore
        shell: cmd

      - name: Build Packfile Limit Adjuster
        run: msbuild "PackfileLimitAdjusterEnhanced-master/PackfileLimitAdjuster.sln" /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore
        shell: cmd

      - name: Build NativeUI
        run: dotnet build "NativeUI-master/NativeUI.sln" -c Release
        shell: pwsh

      - name: Build ScriptHookVDotNet
        run: dotnet build "scripthookvddotnet-main/ScriptHookVDotNet.sln" -c Release
        shell: pwsh

      - name: Build MenyooSP (Trainer)
        run: msbuild "MenyooSP-master/Solution/Menyoo.sln" /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore
        shell: cmd

      - name: Collect and Package Binaries
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Build-350-Ready-Mods
          path: |
            **/Release/**/*.dll
            **/Release/**/*.asi
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.asi
