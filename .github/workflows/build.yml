name: Build All GTA V Mods (Build 350)
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Retarget Projects for VS2022, Latest SDK, and C++17
        run: |
          $sdkVersion = "$env:WindowsSDKVersion".TrimEnd('\')
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            [xml]$xml = Get-Content $_.FullName
            
            # Set target Windows SDK dynamically from runner environment
            $nodes = $xml.GetElementsByTagName('WindowsTargetPlatformVersion')
            foreach ($node in $nodes) {
              $node.InnerText = $sdkVersion
            }
            
            # Retarget platform toolset to VS 2022 (v143)
            $toolsets = $xml.GetElementsByTagName('PlatformToolset')
            foreach ($toolset in $toolsets) {
              $toolset.InnerText = 'v143'
            }
            
            # Enforce C++17 standard to support legacy STL constructs like std::result_of
            $cppLangNodes = $xml.GetElementsByTagName('LanguageStandard')
            foreach ($node in $cppLangNodes) {
              $node.InnerText = 'stdcpp17'
            }
            
            $xml.Save($_.FullName)
          }
        shell: pwsh

      - name: Restore NuGet Packages
        run: |
          $shvSln = Get-ChildItem -Recurse -Filter *ScriptHookV*.sln | Select-Object -First 1
          if ($shvSln) { nuget restore $shvSln.FullName }
        shell: pwsh

      - name: Compile StackWalker Library
        run: |
          $stackWalkerProj = Get-ChildItem -Recurse -Filter *StackWalker*.vcxproj | Select-Object -First 1
          
          if ($stackWalkerProj) {
            Write-Host "Compiling StackWalker project..."
            msbuild $stackWalkerProj.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          } else {
            $stackWalkerCpp = Get-ChildItem -Recurse -Filter *StackWalker*.cpp | Select-Object -First 1
            if ($stackWalkerCpp) {
              Write-Host "Found $($stackWalkerCpp.FullName) — compiling to StackWalker.lib manually..."
              $cppDir = $stackWalkerCpp.DirectoryName
              Push-Location $cppDir
              cl /c /EHsc /O2 /MD $stackWalkerCpp.Name
              lib *.obj /OUT:StackWalker.lib
              Pop-Location
            } else {
              Write-Host "No StackWalker source files found."
            }
          }

          # Stage compiled StackWalker.lib into expected linker directories
          $libs = Get-ChildItem -Recurse -Filter StackWalker.lib
          foreach ($lib in $libs) {
            Write-Host "Placing StackWalker.lib at target directory..."
            Copy-Item $lib.FullName -Destination "ScriptHookV-master/ScriptHookV/" -Force -ErrorAction SilentlyContinue
            Copy-Item $lib.FullName -Destination "ScriptHookV-master/" -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Build ScriptHookV
        run: |
          $sln = Get-ChildItem -Recurse -Filter *ScriptHookV*.sln | Select-Object -First 1
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /p:TreatWarningsAsErrors=false /restore
        shell: pwsh

      - name: Stage ScriptHookV Files for ScriptHookVDotNet
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Workspace: ${{github.workspace}}"
          
          # Locate ScriptHookV header, library, and dll files across workspace
          $shvHeader = Get-ChildItem -Recurse -Filter "ScriptHookV.h" | Select-Object -First 1
          $shvLib    = Get-ChildItem -Recurse -Filter "ScriptHookV.lib" | Select-Object -First 1
          $shvDll    = Get-ChildItem -Recurse -Filter "ScriptHookV.dll" | Select-Object -First 1
          
          Write-Host "Found ScriptHookV.h: $($shvHeader.FullName)"
          Write-Host "Found ScriptHookV.lib: $($shvLib.FullName)"
          Write-Host "Found ScriptHookV.dll: $($shvDll.FullName)"
          
          # Use absolute path for scripthookvdotnet-main
          $shvdnTargetDir = Join-Path "${{github.workspace}}" "scripthookvdotnet-main"
          
          Write-Host "Target directory: $shvdnTargetDir"
          
          if (Test-Path $shvdnTargetDir) {
            Write-Host "Found scripthookvdotnet-main directory"
            
            $sdkDir = Join-Path $shvdnTargetDir "sdk"
            $sdkIncDir = Join-Path $shvdnTargetDir "sdk\inc"
            $libDir = Join-Path $shvdnTargetDir "lib"
            
            New-Item -ItemType Directory -Path $sdkDir -Force | Out-Null
            New-Item -ItemType Directory -Path $sdkIncDir -Force | Out-Null
            New-Item -ItemType Directory -Path $libDir -Force | Out-Null
            
            $copyCount = 0
            
            if ($shvHeader) {
              Copy-Item $shvHeader.FullName -Destination $sdkIncDir -Force -ErrorAction Stop
              Write-Host "✓ Copied ScriptHookV.h to $sdkIncDir"
              $copyCount++
            } else {
              Write-Error "ScriptHookV.h not found!"
              exit 1
            }
            
            if ($shvLib) {
              Copy-Item $shvLib.FullName -Destination $sdkDir -Force -ErrorAction Stop
              Copy-Item $shvLib.FullName -Destination $libDir -Force -ErrorAction Stop
              Write-Host "✓ Copied ScriptHookV.lib to $sdkDir and $libDir"
              $copyCount++
            } else {
              Write-Error "ScriptHookV.lib not found!"
              exit 1
            }
            
            if ($shvDll) {
              Copy-Item $shvDll.FullName -Destination $sdkDir -Force -ErrorAction Stop
              Write-Host "✓ Copied ScriptHookV.dll to $sdkDir"
              $copyCount++
            } else {
              Write-Warning "ScriptHookV.dll not found (may not be required)"
            }
            
            Write-Host "ScriptHookV SDK staging completed successfully ($copyCount files copied)."
          } else {
            Write-Error "scripthookvdotnet-main directory not found at: $shvdnTargetDir"
            Get-ChildItem "$(Split-Path $shvdnTargetDir)" | Write-Host
            exit 1
          }
        shell: pwsh

      - name: Build Heap Adjuster
        run: |
          $sln = Get-ChildItem -Recurse -Filter *HeapAdjuster*.sln | Select-Object -First 1
          if ($sln) {
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore
          } else {
            Write-Warning "HeapAdjuster solution file not found in workspace."
          }
        shell: pwsh

      - name: Build Packfile Limit Adjuster
        run: |
          $sln = Get-ChildItem -Recurse -Filter *PackfileLimitAdjuster*.sln | Select-Object -First 1
          if ($sln) {
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore
          } else {
            Write-Warning "PackfileLimitAdjuster solution file not found in workspace."
          }
        shell: pwsh

      - name: Build ScriptHookVDotNet (MSBuild for C++ Support)
        run: |
          $sln = Get-ChildItem -Recurse -Filter *ScriptHookVDotNet*.sln | Select-Object -First 1
          if ($sln) {
            Write-Host "Building ScriptHookVDotNet via MSBuild: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /restore
          } else {
            Write-Warning "ScriptHookVDotNet solution file not found in workspace."
          }
        shell: pwsh

      - name: Patch NativeUI Project References
        run: |
          $shvdnDll = Get-ChildItem -Recurse -Filter "ScriptHookVDotNet*.dll" | Where-Object { $_.FullName -like "*bin*" -and $_.FullName -like "*Release*" } | Select-Object -First 1
          
          if (-not $shvdnDll) {
            $shvdnDll = Get-ChildItem -Recurse -Filter "ScriptHookVDotNet*.dll" | Select-Object -First 1
          }

          if ($shvdnDll) {
            Write-Host "Found ScriptHookVDotNet assembly at: $($shvdnDll.FullName)"
            
            Get-ChildItem -Recurse -Filter "*NativeUI*.csproj" | ForEach-Object {
              $projPath = $_.FullName
              Write-Host "Injecting assembly reference into: $projPath"
              
              [xml]$xml = Get-Content $projPath
              
              Copy-Item $shvdnDll.FullName -Destination $_.DirectoryName -Force
              
              $itemGroup = $xml.CreateElement("ItemGroup", $xml.DocumentElement.NamespaceURI)
              $reference = $xml.CreateElement("Reference", $xml.DocumentElement.NamespaceURI)
              $reference.SetAttribute("Include", "ScriptHookVDotNet")
              
              $hintPath = $xml.CreateElement("HintPath", $xml.DocumentElement.NamespaceURI)
              $hintPath.InnerText = $shvdnDll.FullName
              
              $reference.AppendChild($hintPath) | Out-Null
              $itemGroup.AppendChild($reference) | Out-Null
              $xml.DocumentElement.AppendChild($itemGroup) | Out-Null
              
              $xml.Save($projPath)
            }
          } else {
            Write-Warning "Could not locate ScriptHookVDotNet.dll to bind NativeUI."
          }
        shell: pwsh

      - name: Build NativeUI
        run: |
          $sln = Get-ChildItem -Recurse -Filter *NativeUI*.sln | Select-Object -First 1
          if ($sln) {
            dotnet build $sln.FullName -c Release
          } else {
            Write-Warning "NativeUI solution file not found in workspace."
          }
        shell: pwsh

      - name: Build MenyooSP (Trainer)
        run: |
          $sln = Get-ChildItem -Recurse -Filter *Menyoo*.sln | Select-Object -First 1
          if ($sln) {
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore
          } else {
            Write-Warning "Menyoo solution file not found in workspace."
          }
        shell: pwsh

      - name: Collect and Package Binaries
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Build-350-Ready-Mods
          path: |
            **/Release/**/*.dll
            **/Release/**/*.asi
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.asi
