name: Build All GTA V Mods (Build 350)
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ScriptHookV
        run: msbuild "ScriptHookV-master/ScriptHookV.sln" /p:Configuration=Release /p:Platform=x64
        shell: cmd

      - name: Build Heap Adjuster
        run: msbuild "gtav-HeapAdjuster-ini-master/HeapAdjuster.sln" /p:Configuration=Release /p:Platform=x64
        shell: cmd

      - name: Build Packfile Limit Adjuster
        run: msbuild "PackfileLimitAdjusterEnhanced-master/PackfileLimitAdjuster.sln" /p:Configuration=Release /p:Platform=x64
        shell: cmd

      - name: Build NativeUI
        run: dotnet build "NativeUI-master/NativeUI.sln" -c Release
        shell: pwsh

      - name: Build ScriptHookVDotNet
        run: dotnet build "scripthookvddotnet-main/ScriptHookVDotNet.sln" -c Release
        shell: pwsh

      - name: Build MenyooSP (Trainer)
        run: msbuild "MenyooSP-master/Solution/Menyoo.sln" /p:Configuration=Release /p:Platform=x64
        shell: cmd

      - name: Collect and Package Binaries
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Build-350-Ready-Mods
          path: |
            **/Release/**/*.dll
            **/Release/**/*.asi
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.asi
