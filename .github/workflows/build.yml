name: Build All GTA V Mods (Build 350)
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Retarget Projects for VS2022, Latest SDK, and C++17
        run: |
          $sdkVersion = "$env:WindowsSDKVersion".TrimEnd('\')
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            [xml]$xml = Get-Content $_.FullName
            
            # Set target Windows SDK
            $nodes = $xml.GetElementsByTagName('WindowsTargetPlatformVersion')
            foreach ($node in $nodes) { $node.InnerText = $sdkVersion }
            
            # Retarget platform toolset
            $toolsets = $xml.GetElementsByTagName('PlatformToolset')
            foreach ($toolset in $toolsets) { $toolset.InnerText = 'v143' }
            
            # Enforce C++17
            $cppLangNodes = $xml.GetElementsByTagName('LanguageStandard')
            foreach ($node in $cppLangNodes) { $node.InnerText = 'stdcpp17' }
            
            $xml.Save($_.FullName)
          }
        shell: pwsh

      - name: Restore NuGet Packages
        run: |
          $shvSln = Get-ChildItem -Recurse -Filter *ScriptHookV*.sln | Select-Object -First 1
          if ($shvSln) { nuget restore $shvSln.FullName }
        shell: pwsh

      - name: Compile StackWalker Library
        run: |
          $stackWalkerProj = Get-ChildItem -Recurse -Filter *StackWalker*.vcxproj | Select-Object -First 1
          
          if ($stackWalkerProj) {
            msbuild $stackWalkerProj.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          } else {
            $stackWalkerCpp = Get-ChildItem -Recurse -Filter *StackWalker*.cpp | Select-Object -First 1
            if ($stackWalkerCpp) {
              $cppDir = $stackWalkerCpp.DirectoryName
              Push-Location $cppDir
              cl /c /EHsc /O2 /MD $stackWalkerCpp.Name
              lib *.obj /OUT:StackWalker.lib
              Pop-Location
            }
          }

          $libs = Get-ChildItem -Recurse -Filter StackWalker.lib
          foreach ($lib in $libs) {
            Copy-Item $lib.FullName -Destination "ScriptHookV-master/ScriptHookV/" -Force -ErrorAction SilentlyContinue
            Copy-Item $lib.FullName -Destination "ScriptHookV-master/" -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Build ScriptHookV
        run: |
          $sln = Get-ChildItem -Recurse -Filter *ScriptHookV*.sln | Select-Object -First 1
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /p:TreatWarningsAsErrors=false /restore
        shell: pwsh

      - name: Build Heap Adjuster
        run: |
          $sln = Get-ChildItem -Recurse -Filter *HeapAdjuster*.sln | Select-Object -First 1
          if ($sln) { msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore }
        shell: pwsh

      - name: Build Packfile Limit Adjuster
        run: |
          $sln = Get-ChildItem -Recurse -Filter *PackfileLimitAdjuster*.sln | Select-Object -First 1
          if ($sln) { msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore }
        shell: pwsh

      - name: Build ScriptHookVDotNet
        run: |
          $sln = Get-ChildItem -Recurse -Filter *ScriptHookVDotNet*.sln | Select-Object -First 1
          if ($sln) { msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /restore }
        shell: pwsh

      - name: Patch NativeUI Project References
        run: |
          $shvdnDll = Get-ChildItem -Recurse -Filter "ScriptHookVDotNet*.dll" | Where-Object { $_.FullName -like "*bin*" -and $_.FullName -like "*Release*" } | Select-Object -First 1
          if (-not $shvdnDll) { $shvdnDll = Get-ChildItem -Recurse -Filter "ScriptHookVDotNet*.dll" | Select-Object -First 1 }

          if ($shvdnDll) {
            Get-ChildItem -Recurse -Filter "*NativeUI*.csproj" | ForEach-Object {
              $projPath = $_.FullName
              [xml]$xml = Get-Content $projPath
              
              Copy-Item $shvdnDll.FullName -Destination $_.DirectoryName -Force
              
              $itemGroup = $xml.CreateElement("ItemGroup", $xml.DocumentElement.NamespaceURI)
              $reference = $xml.CreateElement("Reference", $xml.DocumentElement.NamespaceURI)
              $reference.SetAttribute("Include", "ScriptHookVDotNet")
              
              $hintPath = $xml.CreateElement("HintPath", $xml.DocumentElement.NamespaceURI)
              $hintPath.InnerText = $shvdnDll.FullName
              
              $reference.AppendChild($hintPath) | Out-Null
              $itemGroup.AppendChild($reference) | Out-Null
              $xml.DocumentElement.AppendChild($itemGroup) | Out-Null
              
              $xml.Save($projPath)
            }
          }
        shell: pwsh

      - name: Build NativeUI
        run: |
          $sln = Get-ChildItem -Recurse -Filter *NativeUI*.sln | Select-Object -First 1
          if ($sln) { dotnet build $sln.FullName -c Release }
        shell: pwsh

      - name: Build MenyooSP (Trainer)
        run: |
          $sln = Get-ChildItem -Recurse -Filter *Menyoo*.sln | Select-Object -First 1
          if ($sln) { msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:DisableSpecificWarnings=4834 /restore }
        shell: pwsh

      - name: Collect and Package Binaries
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-Build-350-Ready-Mods
          path: |
            **/Release/**/*.dll
            **/Release/**/*.asi
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.asi
